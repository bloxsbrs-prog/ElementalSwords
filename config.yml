# ElementalSwords settings. Edit, then restart the server.

resource-pack:
  # Send the elemental swords resource pack to players when they join.
  # The pack is built into the plugin, so you don't need GitHub or any outside hosting.
  enabled: true

  # The plugin hands the pack out through its own small download server on this port.
  # This port must be open / allocated to your server (TCP). If it's already used, pick another.
  port: 8163

  # Address players download the pack from. Leave "" to automatically use the same
  # address the player typed to join your server. Only set this if the pack doesn't show up.
  host: ""

  # true = players who decline the pack are kicked. false = they can say no.
  force: false

  # Message shown on the download screen.
  prompt: "Elemental Swords resource pack (adds the 3D swords)"

  # Advanced / optional: host ElementalSwordsPack.zip yourself instead of using the built-in server.
  # Leave "" to use the built-in one.
  external-url: ""
  external-sha1: ""
