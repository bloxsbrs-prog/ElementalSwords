name: ElementalSwords
version: 1.0.0
main: com.example.elementalswords.ElementalSwordsPlugin
api-version: "1.21"
description: Five elemental swords (Fire, Frost, Thunder, Earth, Wind) with abilities and a built-in 3D resource pack.
commands:
  elementalsword:
    description: Give yourself (or another player) an elemental sword
    usage: /elementalsword <fire|ice|lightning|earth|wind|all> [player]
    aliases: [esword, firesword]
    permission: elementalswords.give
permissions:
  elementalswords.give:
    description: Allows using /elementalsword
    default: op
  elementalswords.use:
    description: Allows using the swords' abilities
    default: true
