name: Build ElementalSwords

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build
        run: mvn -B package
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: ElementalSwords-jar
          path: target/ElementalSwords-1.0.0.jar
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v1.0.${{ github.run_number }}" target/ElementalSwords-1.0.0.jar --title "ElementalSwords build ${{ github.run_number }}" --notes "Automatic build"
